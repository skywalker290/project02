<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle and Number Plate Scanner</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333;
        }

        label {
            font-size: 18px;
            color: #555;
        }

        input[type="file"] {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #28a745;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
        }

        #result h2 {
            font-size: 20px;
            color: #333;
        }

        #result p {
            font-size: 16px;
            color: #666;
        }

        .error {
            color: #ff0000;
        }

        /* Spinner Styles */
        #loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Image to Scan Vehicle Type and Number Plate</h1>

        <form id="uploadForm">
            <label for="fileInput">Select Image:</label>
            <input type="file" id="fileInput" accept="image/*" required>
            <br><br>
            <button type="submit">Upload and Scan</button>
        </form>

        <div id="loading">
            <div class="spinner"></div>
            <p>Processing... Please wait.</p>
        </div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const loadingMessage = document.getElementById('loading');
            const resultContainer = document.getElementById('result');
            
            if (!file) {
                alert('Please select an image file to upload.');
                return;
            }

            // Show the loading spinner and clear the result container
            loadingMessage.style.display = 'block';
            resultContainer.innerHTML = '';

            // Create a FormData object to send the file in a POST request
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Upload the image to the server
                const uploadResponse = await fetch('http://13.200.241.87/fileupload', {
                    method: 'POST',
                    body: formData
                });

                const uploadResult = await uploadResponse.json();
                console.log(uploadResult);

                if (uploadResponse.ok) {
                    // Assuming server saves the image as `image_name` after upload
                    const imageName = uploadResult.image_name;

                    // Scan the uploaded image for vehicle and number plate
                    const scanResponse = await fetch('http://13.200.241.87/scan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ image_name: imageName }),
                    });

                    const scanResult = await scanResponse.json();

                    if (scanResponse.ok) {
                        resultContainer.innerHTML = `
                            <h2>Scan Results:</h2>
                            <p><strong>Vehicle Number:</strong> ${scanResult.vehicle_number}</p>
                            <p><strong>Vehicle Type:</strong> ${scanResult.vehicle_type}</p>
                        `;
                    } else {
                        resultContainer.innerHTML = `<p class="error">Error: ${scanResult.error}</p>`;
                    }
                } else {
                    resultContainer.innerHTML = `<p class="error">Error: ${uploadResult.error}</p>`;
                }
            } catch (error) {
                resultContainer.innerHTML = `<p class="error">Error: Failed to connect to the server.</p>`;
                console.error('Error:', error);
            } finally {
                // Hide the loading spinner once the processing is done
                loadingMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
